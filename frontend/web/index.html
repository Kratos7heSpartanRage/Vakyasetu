<!doctype html>
<html lang="sa" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="वाक्यसेतु (VākyaSetu): Pedagogical Sanskrit Sandhi Segmentation and NCERT Learning Assistant" />
    <title>वाक्यसेतु (VākyaSetu) | Sanskrit Sandhi &amp; Learning Assistant</title>
    <!-- Prevent theme flash before paint -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vakyasetu_theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
    <!-- Google Fonts: Tiro Devanagari Sanskrit, Noto Serif Devanagari, Source Serif 4, Kalam -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
